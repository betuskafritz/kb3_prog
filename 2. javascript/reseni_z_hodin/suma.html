<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suma</title>
</head>
<body>
    <p id="vysledek"></p>

    <script>
        let n = Number(prompt("Zadej číslo:"));
        let soucet = 0;
        for (let i = 1; i <= n; i++) {
            soucet += i;    // zkrácení soucet = soucet + i;
        }
        
        document.getElementById("vysledek").innerHTML =
            "Součet od 1 do " + n + " je: " + soucet;
    </script>
</body>
</html>
